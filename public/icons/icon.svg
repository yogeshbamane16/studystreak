<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f11"/>
      <stop offset="50%" stop-color="#181c1e"/>
      <stop offset="100%" stop-color="#101416"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="50%" stop-color="#00e55b"/>
      <stop offset="100%" stop-color="#4cd7f6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#00ff66" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Tactical Reticle Corner Accents -->
  <path d="M 50 110 L 50 50 L 110 50" fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round"/>
  <path d="M 462 110 L 462 50 L 402 50" fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round"/>
  <path d="M 50 402 L 50 462 L 110 462" fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round"/>
  <path d="M 462 402 L 462 462 L 402 462" fill="none" stroke="#00ff66" stroke-width="6" stroke-linecap="round"/>

  <!-- Flame & Streak Lightning Icon with Glow -->
  <g filter="url(#neonGlow)">
    <!-- Fire Flame Base -->
    <path d="M 256 90 C 230 150 170 200 170 290 C 170 370 215 420 256 420 C 297 420 342 370 342 290 C 342 210 295 160 256 90 Z" fill="url(#flameGrad)" fill-opacity="0.95"/>
    <!-- Inner Core Flame -->
    <path d="M 256 220 C 242 255 215 285 215 325 C 215 365 235 390 256 390 C 277 390 297 365 297 325 C 297 275 272 250 256 220 Z" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Bolt Streak -->
    <polygon points="266,160 220,270 255,270 240,360 295,250 260,250" fill="#0b0f11"/>
  </g>
</svg>
